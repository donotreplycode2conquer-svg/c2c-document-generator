services:
  # 1. Backend API Web Service
  - type: web
    name: code2conquer-document-generator-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://c2c-verification-portal.vercel.app
      - key: PUBLIC_VERIFY_BASE_URL
        value: https://c2c-verification-portal.vercel.app
    healthCheckPath: /api/health

  # 2. Frontend Admin Dashboard Static Site
  - type: web
    name: code2conquer-document-generator-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_VERIFICATION_PORTAL_URL
        value: https://c2c-verification-portal.vercel.app
